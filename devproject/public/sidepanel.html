<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevProject Panel</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111827;
        --panel: #1f2937;
        --muted: #9ca3af;
        --text: #f9fafb;
        --accent: #60a5fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .panel {
        width: 100%;
        min-height: 100vh;
        padding: 16px;
        background: var(--panel);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        padding-bottom: 12px;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
      }

      .section {
        margin-bottom: 14px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(255,255,255,0.03);
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <header class="panel-header">
        <h1>DevProject</h1>
      </header>

      <section class="section">
        <h2>Dashboard</h2>
        <p class="muted">Current session: JavaScript Fundamentals</p>
      </section>

      <section class="section">
        <h2>Progress</h2>
        <p>JavaScript: 20%</p>
      </section>

      <section class="section">
        <h2>Quick actions</h2>
        <button>Start Quiz</button>
      </section>
    </div>
  </body>
</html>
